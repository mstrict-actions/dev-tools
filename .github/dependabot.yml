version: 2
updates:
  - package-ecosystem: npm
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    directory: /
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      tooling-minor:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]
